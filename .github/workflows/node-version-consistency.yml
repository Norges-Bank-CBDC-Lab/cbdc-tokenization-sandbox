name: Node Version Consistency

on:
  pull_request:
    paths:
      - "common/node-version.env"
      - "common/helpers.sh"
      - "common/images.yaml"
      - "services/nb-bond-api/Dockerfile"
      - "services/nb-ui/Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "services/nb-bond-api/package.json"
      - "scripts/bid-encryption/package.json"
      - "scripts/bid-submitter/package.json"
      - ".github/workflows/nb-bond-api.yml"
      - ".github/workflows/nb-ui.yml"
      - ".github/workflows/node-version-consistency.yml"
      - "scripts/verification/check-node-version-consistency.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-node-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Node.js version pins
        run: python3 scripts/verification/check-node-version-consistency.py
