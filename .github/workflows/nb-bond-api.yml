name: NB Bond API - Format, Lint, and Test

on:
  pull_request:
    paths:
      - "services/nb-bond-api/**"
      - "common/node-version.env"
      - ".github/workflows/nb-bond-api.yml"

permissions:
  contents: read

jobs:
  format-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nb-bond-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load Node.js version
        id: node-version
        working-directory: .
        run: |
          set -a
          . common/node-version.env
          set +a
          echo "version=${SANDBOX_NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ steps.node-version.outputs.version }}"
          cache: "npm"
          cache-dependency-path: services/nb-bond-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run unit tests
        run: npm test
