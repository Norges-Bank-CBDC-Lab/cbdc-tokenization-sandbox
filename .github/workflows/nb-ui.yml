name: NB UI - Format, Lint, Test, Build

on:
  pull_request:
    paths:
      - "services/nb-ui/**"
      - ".github/workflows/nb-ui.yml"

permissions:
  contents: read

jobs:
  format-lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nb-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/nb-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run production build
        run: npm run build
