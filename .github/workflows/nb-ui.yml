name: NB UI - Format, Lint, Test, Build

on:
  pull_request:
    paths:
      - "services/nb-ui/**"
      - "common/node-version.env"
      - ".github/workflows/nb-ui.yml"

permissions:
  contents: read

jobs:
  format-lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nb-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load Node.js version
        id: node-version
        working-directory: .
        run: |
          set -a
          . common/node-version.env
          set +a
          echo "version=${SANDBOX_NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ steps.node-version.outputs.version }}"
          cache: "npm"
          cache-dependency-path: services/nb-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run production build
        run: npm run build
