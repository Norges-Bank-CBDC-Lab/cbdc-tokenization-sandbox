version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
# Single npm entry for the whole repo: services/nb-bond-api, services/nb-ui,
# scripts/bid-encryption, and scripts/bid-submitter are all declared as
# workspaces of the repo-root package.json, so Dependabot resolves them
# together against the root package-lock.json.
- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: "weekly"
