# Tracked defaults for the nb-ui chart. The `image` value has no default —
# `services/nb-ui/nb-ui.sh start` builds the bundle into a local image, pushes
# it to the kind registry, and sets this value at install time. Direct
# `helm template` / `helm install` invocations must pass it explicitly.

namespace: nb-ui
# The locally-built nb-ui image. Required; produced by nb-ui.sh as
# `localhost:5001/nb-ui:<short-content-hash>`. No default — failing fast at
# render time is better than silently pulling an unrelated nginx.
image: ""
imagePullPolicy: IfNotPresent

rootDnsZone: cbdc-sandbox.local

# Sandbox-conservative hardening defaults. The `nginxinc/nginx-unprivileged`
# image already ships with USER nginx (uid 101); fsGroup makes the
# ConfigMap and tmp emptyDirs accessible to that uid. Override these
# blocks for non-local deployments to tighten further if appropriate.
podSecurityContext:
  fsGroup: 101

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true

# Runtime configuration rendered into /config.js by the chart and served
# alongside the static bundle. See services/nb-ui/src/config.js for the shape.
# Override any of these at deploy time to point the same image at a different
# backend, or to switch the auth plugin without rebuilding.
runtimeConfig:
  apiBaseUrl: http://bond-api.cbdc-sandbox.local
  # Block-explorer base URL for outbound transaction links (System →
  # Operations). Leave empty to render plain hashes without links.
  explorerBaseUrl: http://blockscout.cbdc-sandbox.local
  authMode: none
  authTenantId: ""
  authClientId: ""
  authAuthority: ""
  authScopes: ""
  authRedirectUri: ""
  # Comma-separated Entra App Role values. Only consulted when authMode=entra
  # (ignored locally, where authMode=none means the UI is fully open).
  # Operators get full access including Central Bank; testers get the UI
  # without it. Must match the App Role values defined in Entra and the
  # nb-bond-api NB_BOND_API_AUTH_ENTRA_*_ROLES env.
  authOperatorRoles: "Sandbox.Operator"
  authTesterRoles: "Sandbox.Tester"
  # Opens one authenticated SSE stream per tab when true. Set false to fall
  # back to manual refresh while diagnosing gateway or streaming behaviour.
  liveUpdates: true
