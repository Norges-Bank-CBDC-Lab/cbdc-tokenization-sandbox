# Local sandbox example only.
# The start scripts can generate services/nb-bond-api/helm/values.local.yaml
# automatically via node scripts/generate-local-sandbox-fixtures.mjs.
# If you create it manually, keep the tracked file as a public-safe template.
# Replace the placeholder secrets with base64-encoded private keys for local-only
# sandbox accounts. Never commit or reuse real private keys outside local development.
#
# `image` is set at install time by services/nb-bond-api/nb-bond-api.sh to the
# locally-built `localhost:5001/nb-bond-api:<short-content-hash>` tag. Direct
# `helm template` / `helm install` invocations must pass it explicitly.

namespace: nb-bond-api
imagePullPolicy: IfNotPresent

# Sandbox-conservative hardening defaults. The image already pins USER node
# (uid 1000); fsGroup makes the /app/data volume writable for that uid.
# Override these blocks for non-local deployments to tighten further (e.g.
# readOnlyRootFilesystem: true with appropriate writable tmp mounts).
podSecurityContext:
  fsGroup: 1000

# /app/data holds the SQLite DB: the chain-projection tables (auctions,
# balances, bond_events, ...) which the ingestion loop can rebuild from
# chain on its own, AND the bidders system-of-record (impersonation
# keypairs that cannot be recovered from chain). Without persistence,
# every pod restart wipes the bidder roster — the seed fixture then
# repopulates the canonical set, but any operator-added bidders are gone.
# In the local Kind sandbox the default storageClass `standard` is the
# local-path-provisioner that ships with Kind; the data survives helm
# upgrades + pod restarts and goes away on `kind delete cluster`.
persistence:
  enabled: true
  size: 256Mi
  accessModes:
    - ReadWriteOnce
  # storageClass: standard   # explicit override; default uses cluster default

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Health probes against the in-process Express server. /v1/health returns
# 200 with contract addresses + sealing public key once the chain handshake
# has completed; until then the readiness probe correctly keeps the pod
# out of the Service's endpoint set.
readinessProbe:
  httpGet:
    path: /v1/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /v1/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30
  failureThreshold: 3

env:
  RPC_URL: http://besu.besu:8545
  BOND_MANAGER_CONTRACT_NAME: "Bond Manager"
  # Registry name for the WNOK contract, used by the Central Bank endpoints
  # (/v1/central-bank/*). Matches WNOK_CONTRACT_NAME in contracts/.env.
  WNOK_CONTRACT_NAME: "Wholesale NOK"
  # Auth mode. `none` (sandbox default) accepts the Authorization header but
  # does not validate it. `entra` validates the bearer token as a JWT issued
  # by Microsoft Entra ID and requires NB_BOND_API_AUTH_ENTRA_* below.
  # ArgoCD-managed deployments MUST keep this in sync with nb-ui AUTH_MODE.
  NB_BOND_API_AUTH_MODE: "none"
  # Required only when NB_BOND_API_AUTH_MODE=entra:
  # NB_BOND_API_AUTH_ENTRA_TENANT_ID: "<tenant-guid>"
  # NB_BOND_API_AUTH_ENTRA_AUDIENCE: "<bond-api-app-registration-client-id>"
secret:
  BOND_ADMIN_PK: "<base64-encoded-local-sandbox-private-key>"
  AUCTION_OWNER_SEAL_PK: "<base64-encoded-local-seal-private-key>"
  # Central Bank operator key — must hold MINTER/BURNER/ALLOWLIST_ADMIN roles
  # on the WNOK contract. The local fixture maps this to PK_NORGES_BANK,
  # which `contracts/script/norges-bank/03_Wnok.s.sol` grants at deploy.
  # When unset, /v1/central-bank/* endpoints respond 503 (Service Unavailable).
  CENTRAL_BANK_PK: "<base64-encoded-local-central-bank-private-key>"
