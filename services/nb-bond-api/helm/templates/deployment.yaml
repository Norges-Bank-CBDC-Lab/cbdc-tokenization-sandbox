apiVersion: apps/v1
kind: Deployment
metadata:
  name: nb-bond-api
  namespace: {{ .Values.namespace | default "nb-bond-api" }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: nb-bond-api
  template:
    metadata:
      labels:
        app: nb-bond-api
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nb-bond-api
          image: {{ required "image is required (built by services/nb-bond-api/nb-bond-api.sh)" .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nb-bond-api
                optional: true
            - secretRef:
                name: nb-bond-api
                optional: true
          volumeMounts:
            # The image bakes /app/{dist,node_modules,package.json}. The only
            # writable runtime path is the SQLite ingestion DB under /app/data,
            # made writable for the runtime uid via the pod-level fsGroup.
            - name: nb-bond-api-data
              mountPath: /app/data
      volumes:
        - name: nb-bond-api-data
          emptyDir: {}
