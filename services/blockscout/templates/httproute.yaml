apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blockscout
spec:
  parentRefs:
  - name: gateway
    namespace: nginx-gateway
    sectionName: blockscout-http
  hostnames:
  - "blockscout.{{ .Values.rootDnsZone }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.frontendName }}
          namespace: blockscout
          port: {{ .Values.frontendPort }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.backendName }}
          namespace: blockscout
          port: {{ .Values.backendPort }}
    - matches:
        - path:
            type: PathPrefix
            value: /socket
      backendRefs:
        - name: {{ .Values.backendName }}
          namespace: blockscout
          port: {{ .Values.backendPort }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/
      # The Blockscout frontend v2.7.x calls BENS without the chain_id
      # path segment (e.g. /api/v1/domains:lookup, /api/v1/protocols),
      # but the BENS service expects /api/v1/{chain_id}/... routes per
      # its upstream swagger. Inject the configured chain id here so
      # the route prefix is rewritten before forwarding to BENS — keeps
      # BENS upstream-API-compatible without code changes.
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v1/{{ .Values.config.network.id }}
      backendRefs:
        - name: {{ .Values.bensName }}
          namespace: blockscout
          port: {{ .Values.bensPort }}
