apiVersion: apps/v1
kind: Deployment
metadata:
  name: bens-deployment
  namespace: blockscout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bens
  template:
    metadata:
      labels:
        app: bens
    spec:
      securityContext:
        # nobody:nobody (65534:65534). BENS doesn't write to disk; the
        # image's USER directive pins this and fsGroup keeps any future
        # ConfigMap mounts readable by the runtime uid.
        fsGroup: 65534
      containers:
        - name: bens
          # Built locally and pushed to the kind registry by
          # prepareBensImage (common/helpers.sh); the helm install
          # supplies the content-hash tag via --set bensImage=...
          image: {{ required "bensImage is required (built by prepareBensImage in common/helpers.sh)" .Values.bensImage }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8050
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ .Values.blockscout.env.DATABASE_URL }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8050
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8050
            initialDelaySeconds: 10
            periodSeconds: 15
