[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc = "0.8.35"
evm_version = "london"
bytecode_hash = "none" # cf https://book.getfoundry.sh/guides/deterministic-deployments-using-create2
cbor_metadata = false
# We find that optimizer is disabled (according to JSON in out/) unless explicitly enabled
optimizer = true
optimizer-runs = 200
via_ir = true

[dependencies]
forge-std = "1.16.1"
# OpenZeppelin 5.5.0+ uses Cancun-only MCOPY paths; keep this on 5.4.x
# while the sandbox intentionally compiles for the London EVM milestone.
"@openzeppelin-contracts" = "5.4.0"
"@openzeppelin-contracts-upgradeable" = "5.4.0"

[rpc_endpoints]
besu-local = "${BESU_LOCAL_RPC_URL}"
anvil = "${ANVIL_RPC_URL}"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
