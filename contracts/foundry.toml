[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc = "0.8.36"
evm_version = "osaka"
bytecode_hash = "none" # cf https://book.getfoundry.sh/guides/deterministic-deployments-using-create2
cbor_metadata = false
# We find that optimizer is disabled (according to JSON in out/) unless explicitly enabled
optimizer = true
optimizer-runs = 200
via_ir = true

[dependencies]
forge-std = "1.16.1"
# The Besu chain activates Osaka from genesis, so current OpenZeppelin MCOPY
# paths are supported by the configured EVM milestone.
"@openzeppelin-contracts" = "5.6.1"
"@openzeppelin-contracts-upgradeable" = "5.6.1"

[rpc_endpoints]
besu-local = "${BESU_LOCAL_RPC_URL}"
anvil = "${ANVIL_RPC_URL}"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
