#
# Shared image versions used by the sandbox.
#
# Intent:
# - Keep shared base image tags in one place so upgrades are predictable.
# - Avoid “silent” changes from upstream chart defaults.
#
# Usage:
# - Update the image tag here for images that are sourced from this file.
# - Run: ./infra/infra.sh registry-sync
# - Redeploy the affected component (or ./sandbox.sh start).
#
# Example (upgrade Postgres): change the tag and the digest together, then
# run `python3 scripts/verification/check-image-pins.py`, which lists every
# other file that repeats the reference and must carry the same value.
#   db: postgres:18.7@sha256:<new index digest>
#
# Pinning (the same convention as SANDBOX_NODE_IMAGE in common/node-version.env):
# - Every third-party image below is pinned as <repo>:<tag>@sha256:<digest>,
#   where the digest is the multi-arch INDEX digest (not a per-platform
#   manifest digest), so amd64 and arm64 hosts resolve the same pinned
#   content. The tag stays for readability and for the local registry tag;
#   Docker resolves by digest. The two Blockscout source-built refs (backend,
#   frontend) are upstream release tags, not images, and stay tag-only.
# - To bump: change the tag, read the new index digest with
#   `docker buildx imagetools inspect <repo>:<tag>` (the top-level "Digest:"
#   line, MediaType image index), and edit this file. Then run
#   `python3 scripts/verification/check-image-pins.py`: it rejects a missing
#   or malformed digest and names every other file that repeats the same
#   reference (Dockerfile ARG defaults, chart fallback values, shell defaults)
#   and still needs the new value. The non-blocking report-image-pin-updates.py
#   in the same folder lists pins whose tag now points at a different digest and
#   newer tags in the same line; it never fails.
# - The digest applies to the upstream pull only. The Kind node pulls
#   localhost:5001/<repo>:<tag>-kind by tag from the local registry, so a
#   digest change under an UNCHANGED tag is not picked up by a registry that
#   already holds that tag. Bump the tag where upstream offers one; otherwise
#   run ./infra/infra.sh registry-reset after changing the digest.
# - Tags should be explicit (avoid ":latest") to keep builds reproducible.
# - Service values files may contain fallback refs for direct Helm usage, but
#   the sandbox scripts read deploy/build image pins from this file.
# - For multi-arch images, the registry sync will pull the correct platform.
# - Version sources (check for new tags):
#   - Besu: https://hub.docker.com/r/hyperledger/besu/tags
#   - Postgres: https://hub.docker.com/_/postgres/tags
#   - Python: https://hub.docker.com/_/python/tags
#   - Node: https://hub.docker.com/_/node/tags
#
besu: hyperledger/besu:26.11.2@sha256:19d6cf7fffda207c814778b301b9d4eb8f6f2d7acaad7e4ca4a974784b4f8554

blockscout:
  # Backend + frontend refs name the upstream release tags, but upstream no
  # longer publishes release images to any public registry (ghcr stops at the
  # v9.0.2 / v2.3.5 era). These two images are built from source at the pinned
  # tag by ./sandbox.sh build-images and served from the local kind registry —
  # run build-images once on a fresh machine or after registry-reset.
  # See docs/KNOWN_ISSUES.md.
  backend: ghcr.io/blockscout/blockscout:v12.0.4
  frontend: ghcr.io/blockscout/frontend:v2.13.0
  db: postgres:18.7@sha256:eece53c7c4410fb9c6556a19b8e0f2d61708a5893e2aa0a1e3c716661374ab18
  bens: python:3.14.10@sha256:e5de6bc932256f8138c2353023dc4fd24d010d72f6b5cb06be126f0a4cd53784
  # Smart-contract verification microservice. Modern Blockscout delegates
  # source compilation / bytecode matching to this standalone service; the
  # backend (v10 and later) does not verify in-process. GPL-3.0, same as the
  # rest of the Blockscout stack.
  smart_contract_verifier: ghcr.io/blockscout/smart-contract-verifier:v1.11.2@sha256:dccb08a56e47a7d7b9527ac81074465e0c00fa1b9321581344923a2e9ce2f396

# nb-ui ships as a self-contained image built locally from services/nb-ui/Dockerfile.
# Node.js build/runtime stage bases are centralized in common/node-version.env.
# The nginx runtime base below is pre-pulled by registry-sync so the local
# nb-ui Docker build works without internet.
nb_ui:
  nginx: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03

local_registry: registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
