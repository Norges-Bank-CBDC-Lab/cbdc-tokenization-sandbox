apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: besu-validator
  namespace: {{ .Values.namespace }}
  labels:
    app: besu-validator
    role: validator
spec:
  replicas: 1
  serviceName: besu-validator-p2p
  selector:
    matchLabels:
      app: besu-validator
  template:
    metadata:
      labels:
        app: besu-validator
        role: validator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: resolve-static-peer
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until PEER_IP="$(getent ahostsv4 "$PEER_HOST" | awk 'NR == 1 { print $1 }')" && [ -n "$PEER_IP" ]; do
                echo "Waiting for peer DNS: $PEER_HOST"
                sleep 1
              done
              printf '["enode://%s@%s:30303"]\n' "$PEER_PUBLIC_KEY" "$PEER_IP" > /etc/besu-static/static-nodes.json
          env:
            - name: PEER_HOST
              value: {{ .Values.archive.p2pHost | quote }}
            - name: PEER_PUBLIC_KEY
              value: {{ .Values.archive.nodePublicKey | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: besu-static-peer
              mountPath: /etc/besu-static
      containers:
        - name: besu
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: operator-rpc
              containerPort: 8545
            - name: p2p-tcp
              containerPort: 30303
              protocol: TCP
            - name: p2p-udp
              containerPort: 30303
              protocol: UDP
          volumeMounts:
            - name: besu-validator-data
              mountPath: {{ .Values.dataPath }}
            - name: besu-genesis
              mountPath: /etc/genesis
              readOnly: true
            - name: besu-config
              mountPath: /etc/besu
              readOnly: true
            - name: besu-static-peer
              mountPath: /etc/besu-static
              readOnly: true
            - name: besu-validator-key
              mountPath: {{ .Values.dataPath }}/key
              subPath: key
              readOnly: true
          command: ["/opt/besu/bin/besu"]
          args:
            - --config-file=/etc/besu/validator.toml
            - --genesis-file=/etc/genesis/genesis.json
            - --p2p-host=$(POD_IP)
          readinessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: besu-validator-data
          persistentVolumeClaim:
            claimName: besu-validator-pvc
        - name: besu-genesis
          configMap:
            name: besu-genesis
        - name: besu-config
          configMap:
            name: besu-config
        - name: besu-static-peer
          emptyDir: {}
        - name: besu-validator-key
          secret:
            secretName: besu-validator-key
            defaultMode: 0440
---
