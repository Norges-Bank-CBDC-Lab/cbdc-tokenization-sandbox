apiVersion: v1
kind: Secret
metadata:
  name: besu-validator-key
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  key: {{ required "validator.key must be injected from contracts/.env" .Values.validator.key | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: besu-archive-key
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  key: {{ required "archive.key must be injected from contracts/.env" .Values.archive.key | quote }}
