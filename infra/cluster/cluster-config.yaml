apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
containerdConfigPatches:
  - |-
    # Newer kindest/node images ship containerd configured with `registry.config_path`
    # (certs.d style). Setting `registry.mirrors` alongside `config_path` breaks CRI
    # init with: "mirrors cannot be set when config_path is provided".
    #
    # We rely on a `hosts.toml` mount under /etc/containerd/certs.d/kind/localhost:5001
    # to map localhost:5001 -> kind-registry:5000 inside the kind network.
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d/kind"
nodes:
  - role: control-plane
    image: kindest/node:v1.32.11@sha256:5fc52d52a7b9574015299724bd68f183702956aa4a2116ae75a63cb574b35af8
    # Each published port pairs a fixed nodePort in the gateway chart's
    # NodePort Service (infra/gateway/templates/nodeport-config.yaml) with
    # the host port that scripts, docs, and browser URLs assume (80 for the
    # *.cbdc-sandbox.local hostnames, 8545/8546 for Besu JSON-RPC/WS). On a
    # local port conflict, free the port on the host — remapping here breaks
    # those consumers, which do not discover ports dynamically.
    extraPortMappings:
      - containerPort: 31437
        hostPort: 80
        protocol: TCP
      - containerPort: 31438
        hostPort: 443
        protocol: TCP
      - containerPort: 31439
        hostPort: 8545
        protocol: TCP
      - containerPort: 31440
        hostPort: 8546
        protocol: TCP
    extraMounts:
    # `hostPath` is resolved from the directory where `kind create cluster`
    # is invoked. The sandbox helper runs that command from `infra/`, so this
    # points at the tracked `infra/cluster/containerd-certs.d` directory.
    # Both nb-bond-api and nb-ui used to mount the host source tree here for
    # build-on-boot; both now ship as self-contained images built by their
    # `<svc>.sh start` scripts and pulled from the local registry, so no
    # source mount is needed.
    - hostPath: ./cluster/containerd-certs.d
      containerPath: /etc/containerd/certs.d/kind
